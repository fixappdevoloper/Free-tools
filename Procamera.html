<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unlimited DSLR Camera Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #000; overflow: hidden; height: 100vh; color: white; }
        .viewport { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.3s; }
        
        /* Filters */
        .filter-bar { position: absolute; top: 110px; width: 100%; display: flex; justify-content: center; gap: 8px; z-index: 25; }
        .filter-btn { background: rgba(0,0,0,0.5); border: 1px solid white; color: white; padding: 4px 10px; border-radius: 7px; font-size: 10px; cursor: pointer; }
        .filter-btn.active { background: #ffcc00; color: black; border-color: #ffcc00; }
        
        .mode-switcher { position: absolute; top: 70px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 20; }
        .mode-btn { background: none; border: none; color: rgba(255,255,255,0.6); font-weight: bold; font-size: 14px; cursor: pointer; padding: 5px 10px; }
        .mode-btn.active { color: #ffcc00; border-bottom: 2px solid #ffcc00; }
        
        #blur-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; backdrop-filter: blur(10px); display: none; z-index: 5; mask-image: radial-gradient(circle, transparent 35%, black 80%); -webkit-mask-image: radial-gradient(circle, transparent 35%, black 80%); }
        .top-bar { position: absolute; top: 15px; width: 100%; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; z-index: 30; }
        .btn-glass { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 15px; border-radius: 8px; font-size: 12px; cursor: pointer; }

        /* Bottom Controls */
        .bottom-section { position: absolute; bottom: 0; width: 100%; padding: 20px 0 40px 0; background: linear-gradient(transparent, rgba(0,0,0,0.8)); z-index: 30; }
        .controls-row { display: flex; justify-content: space-around; align-items: center; }
        .shutter-outer { width: 80px; height: 80px; border-radius: 50%; border: 4px solid white; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .shutter-inner { width: 65px; height: 65px; background: white; border-radius: 50%; transition: all 0.3s; }
        .recording .shutter-inner { background: #ff0000; border-radius: 5px; transform: scale(0.6); }
        .preview-circle { width: 50px; height: 50px; border-radius: 12px; background-size: cover; background-position: center; border: 2px solid white; background-color: #333; }

        /* Gallery Grid */
        #gallery-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; flex-direction: column; }
        .gallery-item { position: relative; aspect-ratio: 1; overflow: hidden; background: #111; border: 0.5px solid #222; }
        .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }

        /* Viewer & Action Styles */
        #viewer { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        .action-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 3s Loading Animation */
        .loader-circle { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #ffcc00; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Delete Dialog */
        #delete-dialog { position: fixed; bottom: -100%; left: 0; width: 100%; background: #1a1a1a; padding: 30px 20px; border-radius: 25px 25px 0 0; z-index: 4000; transition: 0.4s ease; text-align: center; }
        #delete-dialog.active { bottom: 0; }
        .btn-big { width: 100%; padding: 18px; border-radius: 15px; border: none; font-size: 16px; font-weight: bold; margin: 8px 0; cursor: pointer; }
        .btn-red { background: #ff4444; color: white; }
        .btn-gray { background: #333; color: white; }

        .timer { position: absolute; top: 135px; width: 100%; text-align: center; color: red; font-weight: bold; display: none; z-index: 20; }
    </style>
</head>
<body>

    <div class="action-overlay" id="global-loader">
        <div class="loader-circle"></div>
        <p id="loader-msg" style="margin-top: 15px; font-size: 14px; letter-spacing: 1px;">SABAR KARO...</p>
    </div>

    <div id="delete-dialog">
        <h3 style="margin-bottom: 20px;">Kya photo ko delete karna chahte ho?</h3>
        <button class="btn-big btn-red" id="confirm-delete">HAAN, DELETE KARO</button>
        <button class="btn-big btn-gray" onclick="closeDelete()">NAHI, CANCEL</button>
    </div>

    <div class="viewport">
        <div id="blur-overlay"></div>
        <div class="top-bar">
            <button class="back-btn" onclick="window.location.href='index.html'"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" class="bi bi-arrow-left-short" viewBox="0 0 16 16">
    <path fill-rule="evenodd" d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5" />
</svg></button>
            <button class="btn-glass" id="dslr-btn" onclick="toggleDSLR()">DSLR OFF</button>
        </div>
        <div class="mode-switcher">
            <button class="mode-btn active" id="mode-photo" onclick="switchMode('photo')">PHOTO</button>
            <button class="mode-btn" id="mode-video" onclick="switchMode('video')">VIDEO</button>
        </div>
        <div class="filter-bar">
            <button class="filter-btn active" onclick="setFilter('none', this)">Normal</button>
            <button class="filter-btn" onclick="setFilter('grayscale(1)', this)">B&W</button>
            <button class="filter-btn" onclick="setFilter('contrast(1.5) saturate(1.5)', this)">Vivid</button>
            <button class="filter-btn" onclick="setFilter('sepia(0.8) brightness(0.9)', this)">Vintage</button>
        </div>
        <div class="timer" id="recording-timer">00:00</div>
        <video id="video" autoplay playsinline muted></video>
        <div class="bottom-section">
            <div style="text-align:center; margin-bottom: 20px;">
                <span id="zoomVal" style="font-size: 10px; color: #ffcc00;">1.0x</span><br>
                <input type="range" id="zoomRange" min="1" max="100" value="1" style="width:80%; accent-color:#ffcc00;">
            </div>
            <div class="controls-row">
                <div class="preview-circle" id="last-thumb" onclick="openGallery()"></div>
                <div class="shutter-outer" id="main-action"><div class="shutter-inner" id="shutter-btn"></div></div>
                <button class="btn-glass" style="border-radius:50%; width:50px; height:50px; padding:0;" onclick="switchCamera()"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" class="bi bi-camera-fill" viewBox="0 0 16 16">
  <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
  <path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1m9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0"/>
</svg></button>
            </div>
        </div>
    </div>

    <div id="gallery-overlay">
        <div style="padding: 20px; display:flex; justify-content: space-between; align-items: center; background: #111;">
            <button class="btn-glass" onclick="closeGallery()">← BACK</button>
            <h3>MY GALLERY</h3>
            <span id="stat-count" style="font-size:12px; color:#ffcc00;">0</span>
        </div>
        <div class="gallery-grid" id="galleryGrid" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:2px; overflow-y:auto; flex-grow:1;"></div>
    </div>

    <div id="viewer">
        <div style="padding:15px;"><button class="btn-glass" onclick="closeViewer()">CLOSE</button></div>
        <div id="viewer-content" style="flex-grow:1; display:flex; align-items:center; justify-content:center; overflow:hidden; transition: 0.3s ease;"></div>
        <div style="padding:30px 20px; display:flex; justify-content:space-around; background:#111; align-items:center;">
            <button class="btn-glass" id="v-download" style="background:#fff; color:#000; border:none; font-weight:bold;">Download</button>
            <button class="btn-glass" id="v-share">Share</button>
            <button class="btn-glass" id="v-delete-btn" style="background:rgba(255,0,0,0.2); color:#ff4444; border:1px solid #ff4444;">Delete</button>
        </div>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        let db;
        const dbRequest = indexedDB.open("CameraDB", 1);
        dbRequest.onupgradeneeded = e => {
            db = e.target.result;
            db.createObjectStore("media", { keyPath: "id", autoIncrement: true });
        };
        dbRequest.onsuccess = e => { db = e.target.result; updateThumb(); };

        function dbSave(item) {
            const tx = db.transaction("media", "readwrite");
            tx.objectStore("media").add(item);
            tx.oncomplete = () => updateThumb();
        }

        function dbGetAll(callback) {
            const tx = db.transaction("media", "readonly");
            tx.objectStore("media").getAll().onsuccess = e => callback(e.target.result);
        }

        function dbDelete(id, callback) {
            const tx = db.transaction("media", "readwrite");
            tx.objectStore("media").delete(id).onsuccess = callback;
        }

        let stream, recorder, chunks = [];
        let currentMode = 'photo', isRecording = false, useFront = false, dslrActive = false, currentFilter = 'none';

        async function initCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            const constraints = { video: { facingMode: useFront ? "user" : "environment", width: 1280, height: 720 }, audio: true };
            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('video').srcObject = stream;
                applyUIEffects();
            } catch(e) { alert("Camera not found!"); }
        }

        function applyUIEffects() {
            let scale = 1 + (document.getElementById('zoomRange').value / 25);
            let mirror = useFront ? "scaleX(-1)" : "scaleX(1)";
            document.getElementById('video').style.transform = `${mirror} scale(${scale})`;
            document.getElementById('video').style.filter = currentFilter;
        }

        function setFilter(f, btn) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyUIEffects();
        }

        document.getElementById('zoomRange').oninput = (e) => {
            document.getElementById('zoomVal').innerText = (1 + e.target.value/25).toFixed(1) + "x";
            applyUIEffects();
        };

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('mode-photo').classList.toggle('active', mode === 'photo');
            document.getElementById('mode-video').classList.toggle('active', mode === 'video');
            document.getElementById('shutter-btn').style.backgroundColor = mode === 'photo' ? 'white' : 'red';
        }

        function toggleDSLR() {
            dslrActive = !dslrActive;
            document.getElementById('blur-overlay').style.display = dslrActive ? 'block' : 'none';
            document.getElementById('dslr-btn').innerText = dslrActive ? "DSLR ON" : "DSLR OFF";
        }

        document.getElementById('main-action').onclick = () => {
            if (currentMode === 'photo') takePhoto();
            else isRecording ? stopRecording() : startRecording();
        };

        function takePhoto() {
            const vid = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = vid.videoWidth;
            canvas.height = vid.videoHeight;
            let scale = 1 + (document.getElementById('zoomRange').value / 25);
            ctx.filter = currentFilter;
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            if(useFront) ctx.scale(-1, 1);
            ctx.scale(scale, scale);
            ctx.drawImage(vid, -canvas.width/2, -canvas.height/2, canvas.width, canvas.height);
            ctx.restore();
            dbSave({ data: canvas.toDataURL('image/jpeg'), type: 'image', timestamp: Date.now() });
            flashEffect();
        }

        function startRecording() {
            chunks = [];
            recorder = new MediaRecorder(stream);
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const reader = new FileReader();
                reader.onload = () => dbSave({ data: reader.result, type: 'video', timestamp: Date.now() });
                reader.readAsDataURL(blob);
            };
            recorder.start();
            isRecording = true;
            document.getElementById('main-action').classList.add('recording');
            startTimer();
        }

        function stopRecording() { recorder.stop(); isRecording = false; document.getElementById('main-action').classList.remove('recording'); stopTimer(); }

        // --- Gallery & Viewer Logic ---
        function openGallery() {
            document.getElementById('gallery-overlay').style.display = 'flex';
            dbGetAll(items => {
                const grid = document.getElementById('galleryGrid');
                grid.innerHTML = '';
                document.getElementById('stat-count').innerText = items.length;
                items.reverse().forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    div.onclick = () => viewItem(item);
                    div.innerHTML = item.type === 'image' ? `<img src="${item.data}">` : `<video src="${item.data}"></video>`;
                    grid.appendChild(div);
                });
            });
        }

        async function viewItem(item) {
            const viewerContent = document.getElementById('viewer-content');
            viewerContent.style.transform = "scale(1)";
            viewerContent.innerHTML = item.type === 'image' ? `<img src="${item.data}" style="max-width:100%;">` : `<video src="${item.data}" controls autoplay style="max-width:100%;"></video>`;
            document.getElementById('viewer').style.display = 'flex';

            // Download Logic (3s)
            document.getElementById('v-download').onclick = () => {
                showActionLoader("SAVING...", () => {
                    const link = document.createElement('a');
                    link.download = `Media_${Date.now()}`;
                    link.href = item.data;
                    link.click();
                });
            };

            // Share Logic (3s + Animation)
            document.getElementById('v-share').onclick = async () => {
                showActionLoader("PREPARING SHARE...", async () => {
                    try {
                        const blob = await (await fetch(item.data)).blob();
                        const file = new File([blob], item.type === 'image' ? 'photo.jpg' : 'video.mp4', { type: blob.type });
                        if (navigator.share) {
                            await navigator.share({ files: [file], title: 'My Pro Camera' });
                        } else { alert("Share not supported in this browser"); }
                    } catch (e) { console.log(e); }
                });
            };

            // Delete Logic (Animation)
            document.getElementById('v-delete-btn').onclick = () => {
                document.getElementById('delete-dialog').classList.add('active');
                document.getElementById('confirm-delete').onclick = () => {
                    viewerContent.style.transform = "scale(0) rotate(15deg)";
                    setTimeout(() => {
                        dbDelete(item.id, () => {
                            closeDelete();
                            closeViewer();
                            openGallery();
                            updateThumb();
                        });
                    }, 400);
                };
            };
        }

        function showActionLoader(msg, callback) {
            const loader = document.getElementById('global-loader');
            document.getElementById('loader-msg').innerText = msg;
            loader.style.display = 'flex';
            setTimeout(() => {
                loader.style.display = 'none';
                callback();
            }, 3000);
        }

        function closeDelete() { document.getElementById('delete-dialog').classList.remove('active'); }
        function startTimer() { /* Timer Code */ }
        function stopTimer() { /* Timer Stop Code */ }
        function switchCamera() { useFront = !useFront; initCamera(); }
        function updateThumb() {
            dbGetAll(items => {
                if (items.length > 0) document.getElementById('last-thumb').style.backgroundImage = `url(${items[items.length-1].data})`;
            });
        }
        function flashEffect() {
            const f = document.createElement('div');
            f.style.cssText = "position:fixed; inset:0; background:white; z-index:1000;";
            document.body.appendChild(f); setTimeout(() => f.remove(), 50);
        }
        function closeGallery() { document.getElementById('gallery-overlay').style.display = 'none'; }
        function closeViewer() { document.getElementById('viewer').style.display = 'none'; }

        initCamera();
    </script>
</body>
</html>
