<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बाल पाठशाला - Learn English with Arun Sir</title>
    <style>
        :root {
            --primary-color: #ff5722;
            --secondary-color: #4caf50;
            --board-bg: #1e4620; /* क्लासरूम बोर्ड का हरा रंग */
            --bg-color: #ffeb3b; /* बच्चों का पसंदीदा पीला रंग */
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffeb3b, #ff9800);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        header {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(to bottom, #ff2a6d, #ff5722);
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 6px 0 #b33600;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            text-shadow: 2px 2px 0px #000;
        }

        .app-container {
            width: 90%;
            max-width: 450px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 140px;
        }

        /* वेलकम / नेम इनपुट स्क्रीन स्टाइल */
        .welcome-screen {
            background: white;
            border: 4px solid #000;
            border-bottom: 10px solid #000;
            border-radius: 25px;
            width: 100%;
            padding: 25px;
            box-sizing: border-box;
            text-align: center;
            margin-top: 40px;
            display: none;
        }

        .welcome-screen input {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border: 3px solid #000;
            border-radius: 15px;
            text-align: center;
            margin: 15px 0;
            outline: none;
        }

        .welcome-screen button {
            background: #4caf50;
            color: white;
            border: 3px solid #000;
            border-bottom: 6px solid #000;
            border-radius: 15px;
            padding: 10px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 2D क्लासरूम और अरुण सर */
        .classroom-container {
            width: 100%;
            background: #a0522d; /* लकड़ी का फ्रेम */
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        /* ब्लैकबोर्ड / व्हाइटबोर्ड */
        .smart-board {
            background-color: var(--board-bg);
            border: 6px solid #5d3a1a;
            border-radius: 10px;
            padding: 15px;
            color: #ffffff;
            min-height: 120px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .board-chalk-text {
            color: #f5f5f5;
            font-family: 'Courier New', Courier, monospace;
            border-bottom: 2px dashed #ffffff;
            padding-bottom: 5px;
            margin-bottom: 10px;
            width: 100%;
        }

        /* 2D Teacher Animation Scene */
        .teacher-scene {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            gap: 20px;
            width: 100%;
            position: relative;
        }

        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: #ffdbac;
            border-radius: 50%;
            position: relative;
            border: 4px solid #000;
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
        }

        /* चश्मा */
        .avatar::before {
            content: '👓';
            position: absolute;
            top: 12px;
            left: 16px;
            font-size: 45px;
            z-index: 2;
        }

        /* बोलते हुए मुँह का एनीमेशन */
        .mouth {
            position: absolute;
            bottom: 18px;
            left: 32px;
            width: 26px;
            height: 10px;
            background: #ff3333;
            border-radius: 0 0 20px 20px;
            border: 3px solid #000;
            transition: 0.1s;
        }

        /* पढ़ाने वाली छड़ी (Pointer Stick) */
        .teaching-stick {
            font-size: 45px;
            position: absolute;
            right: -20px;
            top: 10px;
            transform: rotate(-20deg);
            transition: 0.3s ease;
            transform-origin: bottom left;
        }

        .stick-moving {
            animation: pointAction 0.6s infinite alternate;
        }

        @keyframes pointAction {
            0% { transform: rotate(-20deg) translateY(0); }
            100% { transform: rotate(-45deg) translateY(-10px); }
        }

        /* अरुण सर का डायलॉग बॉक्स */
        .speech-bubble {
            background: white;
            border: 4px solid #000;
            border-radius: 20px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 6px 0 #000;
            flex-1: 1;
            max-width: 60%;
            position: relative;
        }

        /* मेनू की बनावट - बच्चों के रंग */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }

        .topic-btn {
            background: white;
            border: 3px solid #000;
            border-bottom: 8px solid #000;
            border-radius: 20px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.1s;
        }

        .topic-btn:nth-child(odd) { background-color: #98ff98; }
        .topic-btn:nth-child(even) { background-color: #ffb3d9; }

        .topic-btn:active {
            transform: translateY(4px);
            border-bottom-width: 4px;
        }

        .topic-icon {
            font-size: 28px;
            background: white;
            padding: 5px 10px;
            border-radius: 12px;
            border: 2px solid #000;
        }

        /* गेम / क्विज स्क्रीन */
        .game-card {
            background: white;
            border: 4px solid #000;
            border-bottom: 10px solid #000;
            border-radius: 25px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: none;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            width: 100%;
            margin-top: 15px;
        }

        .opt-btn {
            background: #e3f2fd;
            border: 3px solid #000;
            border-bottom: 6px solid #000;
            border-radius: 15px;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.1s;
        }

        .opt-btn:active {
            transform: translateY(3px);
            border-bottom-width: 3px;
        }

        .back-btn {
            background: #ff5722;
            color: white;
            border: 3px solid #000;
            border-bottom: 5px solid #000;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            align-self: flex-start;
            display: none;
        }

        /* बॉटम रिजल्ट बार */
        .bottom-bar {
            width: 100%;
            max-width: 500px;
            position: fixed;
            bottom: 0;
            padding: 20px 0;
            text-align: center;
            display: none;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            border-top: 4px solid #000;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .success-bar { background-color: #81c784; color: #004d40; }
        .wrong-bar { background-color: #e57373; color: #4a0000; }

        .next-btn {
            background: #fff;
            color: #000;
            border: 3px solid #000;
            border-bottom: 6px solid #000;
            border-radius: 15px;
            padding: 10px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
        }

        .score-board { 
            font-size: 18px; 
            font-weight: bold; 
            color: #fff; 
            background: #000; 
            padding: 5px 15px; 
            border-radius: 20px; 
        }

        .edit-name-btn {
            background: #ff2a6d;
            color: white;
            border: 2px solid #000;
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* एनीमेशन लिप सिंक */
        .talking { animation: mouthTalk 0.2s infinite alternate; }
        @keyframes mouthTalk { 0% { height: 4px; } 100% { height: 18px; border-radius: 50%; } }
    </style>
</head>
<body>

    <header>🎒 बाल पाठशाला 🎒</header>

    <div class="app-container">
        
        <!-- फर्स्ट टाइम नेम इनपुट स्क्रीन -->
        <div class="welcome-screen" id="name-screen">
            <h2>👋 हेलो प्यारे बच्चे!</h2>
            <p>अपना सुंदर सा नाम नीचे लिखो ताकि अरुण सर आपको नाम से बुला सकें:</p>
            <input type="text" id="user-name-input" placeholder="यहाँ अपना नाम लिखें..." maxlength="15">
            <br>
            <button onclick="saveNameAndStart()">चलो शुरू करें! 🚀</button>
        </div>

        <!-- मुख्य गेमप्ले एरिया ग्रुप -->
        <div id="main-gameplay-area" style="display:none; width:100%;">
            <div class="score-row">
                <button class="back-btn" id="back-button" onclick="showMainMenu()" style="margin-bottom:0;">back</button>
                <div class="score-board" id="score-display">⭐: 0</div>
                <button class="edit-name-btn" onclick="resetName()">✏️ नाम बदलें</button>
            </div>

            <div class="classroom-container">
                <div class="smart-board" id="classroom-board">
                    <div class="board-chalk-text" id="board-title">WELCOME CLASS</div>
                    <div id="board-main-content">चलो बच्चों, आज कुछ नया और मज़ेदार सीखते हैं! 🎯</div>
                </div>
                
                <div class="teacher-scene">
                    <div class="avatar-wrapper">
                        <div class="avatar">
                            <div class="mouth" id="teacher-mouth"></div>
                        </div>
                        <div class="teaching-stick" id="teacher-stick">🪄</div>
                    </div>
                    <div class="speech-bubble" id="speech-text">हेलो बच्चों! मैं हूँ आपका अरुण सर। नीचे से कोई भी प्यारा सा टॉपिक चुनो और पढ़ना शुरू करो! 👇</div>
                </div>
            </div>

            <div class="menu-grid" id="main-menu">
                <button class="topic-btn" onclick="startTopic(1)">
                    <span class="topic-icon">🅰️</span> <span>1. A SE Z (अल्फाбет्स)</span>
                </button>
                <button class="topic-btn" onclick="startTopic(2)">
                    <span class="topic-icon">📖</span> <span>2. Word Meaning (शब्दार्थ)</span>
                </button>
                <button class="topic-btn" onclick="startTopic(3)">
                    <span class="topic-icon">⏳</span> <span>3. Tense (समय चक्र)</span>
                </button>
                <button class="topic-btn" onclick="startTopic(4)">
                    <span class="topic-icon">📝</span> <span>4. वाक्य प्रयोग (Sentence)</span>
                </button>
                <button class="topic-btn" onclick="startTopic(5)">
                    <span class="topic-icon">🗣️</span> <span>5. Direct Indirect Speech</span>
                </button>
                <button class="topic-btn" onclick="startTopic(6)">
                    <span class="topic-icon">🇮🇳</span> <span>6. हिंदी से अंग्रेजी बनाना</span>
                </button>
                <button class="topic-btn" onclick="startTopic(7)">
                    <span class="topic-icon">🇬🇧</span> <span>7. English से हिंदी अनुवाद</span>
                </button>
                <button class="topic-btn" onclick="startTopic(8)">
                    <span class="topic-icon">🎯</span> <span>8. मज़ेदार टेस्ट (खेलेगा इंडिया!)</span>
                </button>
            </div>

            <div class="game-card" id="game-screen">
                <div class="options-grid" id="options-box"></div>
            </div>
        </div>
    </div>

    <div class="bottom-bar" id="result-bar">
        <div style="font-size: 20px; font-weight: bold;" id="result-message">सही जवाब!</div>
        <button class="next-btn" onclick="handleNext()">अगला सवाल ➡️</button>
    </div>

    <script>
        const megaDatabase = {
           1: [

        let currentModule = null;
        let currentQIndex = 0;
        let score = 0;
        let childName = "";

        const speechText = document.getElementById('speech-text');
        const teacherMouth = document.getElementById('teacher-mouth');
        const teacherStick = document.getElementById('teacher-stick');
        const classroomBoard = document.getElementById('classroom-board');
        const boardTitle = document.getElementById('board-title');
        const boardMainContent = document.getElementById('board-main-content');
        const mainMenu = document.getElementById('main-menu');
        const gameScreen = document.getElementById('game-screen');
        const backButton = document.getElementById('back-button');
        const optionsBox = document.getElementById('options-box');
        const resultBar = document.getElementById('result-bar');
        const resultMessage = document.getElementById('result-message');
        const scoreDisplay = document.getElementById('score-display');
        
        const nameScreen = document.getElementById('name-screen');
        const mainGameplayArea = document.getElementById('main-gameplay-area');
        const userNameInput = document.getElementById('user-name-input');

        // पेज लोड होने पर चेक करें कि नाम पहले से सेव है या नहीं
        window.onload = function() {
            let savedName = localStorage.getItem("balPathshalaName");
            if (savedName) {
                childName = savedName;
                showDashboard();
            } else {
                nameScreen.style.display = "block";
                mainGameplayArea.style.display = "none";
                arunSirSpeak("हेलो प्यारे बच्चे, अपना सुंदर सा नाम लिखो ताकि मैं आपको नाम से बुला सकूँ!");
            }
        };

        function saveNameAndStart() {
            let nameVal = userNameInput.value.trim();
            if (nameVal === "") {
                arunSirSpeak("अरे, अपना नाम तो लिखो बच्चे!");
                alert("कृपया अपना नाम लिखें!");
                return;
            }
            localStorage.setItem("balPathshalaName", nameVal);
            childName = nameVal;
            showDashboard();
        }

        function resetName() {
            localStorage.removeItem("balPathshalaName");
            window.speechSynthesis.cancel();
            nameScreen.style.display = "block";
            mainGameplayArea.style.display = "none";
            resultBar.style.display = "none";
            userNameInput.value = "";
            arunSirSpeak("चलो, अपना नया नाम बताओ बच्चे!");
        }

        function showDashboard() {
            nameScreen.style.display = "none";
            mainGameplayArea.style.display = "block";
            showMainMenu();
        }

        function arunSirSpeak(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.92;

                teacherMouth.classList.add('talking');
                teacherStick.classList.add('stick-moving');
                
                utterance.onend = () => {
                    teacherMouth.classList.remove('talking');
                    teacherStick.classList.remove('stick-moving');
                    if(callback) callback();
                };
                window.speechSynthesis.speak(utterance);
            } else {
                if(callback) callback();
            }
        }

        function startTopic(moduleNum) {
            currentModule = moduleNum;
            currentQIndex = 0;
            
            mainMenu.style.display = 'none';
            gameScreen.style.display = 'block';
            backButton.style.display = 'block';
            resultBar.style.display = 'none';

            let introTexts = [
                "", 
                `चलो ${childName}, अब हम सब मिलकर ए से जेड तक अल्फाबेट्स सीखेंगे!`,
                `अरे वाह ${childName}! अब हम नए-नए शब्दों के मजेदार अर्थ सीखेंगे।`,
                `टेंस की क्लास शुरू हो गई है ${childName}, ध्यान से समझना!`,
                `वाक्यों का सही इस्तेमाल करना सीखते हैं, चलिए ${childName}!`,
                `${childName}, डायरेक्ट इनडायरेक्ट स्पीच समझना अब होगा बहुत आसान!`,
                `चलो ${childName}, हिंदी लाइनों को फटाफट इंग्लिश में बदलना सीखते हैं!`,
                `इंग्लिश में लिखी बातों का हिंदी मतलब समझते हैं, आ जाओ ${childName}!`,
                `परीक्षा की घड़ी आ गई ${childName}, देखते हैं आप कितने अंक लाते हो!`
            ];

            boardTitle.innerText = `TOPIC CODE: 0${moduleNum}`;
            boardMainContent.innerText = "क्लास शुरू हो रही है... 📖";
            speechText.innerText = `अरुण सर: शुरू करते हैं ${childName}... 🎧`;
            
            arunSirSpeak(introTexts[moduleNum], () => {
                loadQuestion();
            });
        }

        function showMainMenu() {
            window.speechSynthesis.cancel();
            currentModule = null;
            mainMenu.style.display = 'grid';
            gameScreen.style.display = 'none';
            backButton.style.display = 'none';
            resultBar.style.display = 'none';
            boardTitle.innerText = "WELCOME CLASS";
            boardMainContent.innerText = `नमस्ते ${childName}, आज कुछ नया सीखते हैं! 🎯`;
            speechText.innerText = `अरुण सर: कोई भी नया टॉपिक चुनो ${childName}, फिर साथ में मिलकर पढ़ेंगे!`;
            
            arunSirSpeak(`नमस्ते ${childName}! बाल पाठशाला में आपका स्वागत है। नीचे से कोई भी प्यारा सा टॉपिक चुनो और पढ़ना शुरू करो!`);
        }

        function loadQuestion() {
            resultBar.style.display = 'none';
            let currentList = megaDatabase[currentModule] || megaDatabase[1];

            if (currentQIndex >= currentList.length) {
                endClass();
                return;
            }

            let data = currentList[currentQIndex];
            
            boardMainContent.innerText = data.q;
            speechText.innerText = `अरुण सर: बोर्ड पर देखो ${childName} और सही उत्तर चुनो!`;
            
            arunSirSpeak(`${childName}, बताओ ... ` + data.q);

            optionsBox.innerHTML = '';
            data.opts.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = option;
                btn.onclick = () => verifySelection(btn, option, data.ans, data.info);
                optionsBox.appendChild(btn);
            });
        }

        function verifySelection(selectedBtn, chosenValue, correctValue, explanatoryNote) {
            const allButtons = document.querySelectorAll('.opt-btn');
            allButtons.forEach(b => b.disabled = true);

            resultBar.style.display = 'block';

            if (chosenValue === correctValue) {
                score += 10;
                scoreDisplay.innerText = `⭐: ${score}`;
                resultBar.className = "bottom-bar success-bar";
                resultMessage.innerHTML = `🎉 अरे वाह ${childName}! बिल्कुल सही जवाब! <br><small>${explanatoryNote}</small>`;
                speechText.innerText = `अरुण सर: शाबाश ${childName}! सही जवाब ${correctValue} ही है।`;
                arunSirSpeak(`अरे वाह ${childName}! बिल्कुल सही जवाब! और बात यह है कि ${explanatoryNote}`);
            } else {
                resultBar.className = "bottom-bar wrong-bar";
                resultMessage.innerHTML = `😢 ओहो ${childName}! थोड़ा सा चूक गए। <br><small>सही उत्तर बोर्ड पर देखो: <b>${correctValue}</b></small>`;
                speechText.innerText = `अरुण सर: कोई बात नहीं ${childName}, सीखो! सही जवाब ${correctValue} है।`;
                arunSirSpeak(`ओहो ${childName}! कोई बात नहीं बच्चे, कोशिश करने वालों की हार नहीं होती। बोर्ड पर देखो, इसका सही जवाब है ${correctValue}.`);
            }
        }

        function handleNext() {
            currentQIndex++;
            loadQuestion();
        }

        function endClass() {
            resultBar.style.display = 'none';
            gameScreen.style.display = 'none';
            boardMainContent.innerText = "क्लास समाप्त! ⭐️";
            let closingText = `अरे वाह ${childName}! आपने आज की क्लास पूरी कर ली। मुझे बहुत मज़ा आया, अब मिलेंगे अगली क्लास में!`;
            speechText.innerText = closingText;
            arunSirSpeak(closingText, () => {
                showMainMenu();
            });
        }
    </script>
</body>
